<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <h1>Panel del Jefe de Ventas</h1>

    <input
        type="text"
        id="nombreViaje"
        placeholder="Nombre del viaje">

    <input
        type="text"
        id="descripcionViaje"
        placeholder="Descripción">

    <input
        type="number"
        id="precioViaje"
        placeholder="Precio">

    <input
        type="text"
        id="imagenViaje"
        placeholder="Imagen (ej: bariloche.jpg)">

    <button onclick="agregarViaje()">
        Agregar Viaje
    </button>

    <hr>

    <h2>Viajes cargados</h2>

    <div id="listaProductos"></div>

    <button onclick="cerrarSesion()">
        Cerrar Sesión
    </button>

    <script src="script.js"></script>

    <script>
        mostrarViajes();
    </script>

</body>

</html>
