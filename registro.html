<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="icon"
          type="image/x-icon"
          href="ArgenVia.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - ArgenVia</title>

    <link rel="stylesheet"
          href="estilos.css">
</head>

<body>

    <div id="modal-registro">

        <div class="login-contenido">

            <h2>Registrate</h2>

            <input
                type="text"
                id="nuevoUsuario"
                placeholder="Nuevo Usuario">

            <input
                type="email"
                id="nuevoEmail"
                placeholder="Correo Electrónico">

            <input
                type="password"
                id="nuevoPassword"
                placeholder="Contraseña">

            <button onclick="registrar()">
                Registrarse
            </button>

            <button onclick="window.location.href='index.html'">
                Volver al inicio
            </button>

            <p class="texto-registro">

                ¿Ya tenés una cuenta?

                <a href="iniciosesion.html">
                    Iniciar Sesión
                </a>

            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
