<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/x-icon" href="ArgenVia.png">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - ArgenVia</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div id="modal-login"
         style="display:block;">

        <div class="login-contenido">

            <h2>Iniciar sesión</h2>

            <input
                type="text"
                id="usuario"
                placeholder="Usuario">

            <input
                type="password"
                id="password"
                placeholder="Contraseña">

            <button onclick="entrar()">
                Entrar
            </button>

            <button onclick="window.location.href='index.html'">
                Volver al inicio
            </button>

            <p class="texto-registro">
                ¿No estás registrado?
                <a href="registro.html">
                    Registrate
                </a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
